<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashish's Website | AI Agents, Backend, Software Development</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"
    integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ"
    crossorigin="anonymous"></script>
  <style>
    .content-not-ready {
      display: none;
    }

    body.loading {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      background-color: #fff;
      height: 100vh;
    }

    @keyframes ldio-0chhxaqs32b9 {
      0% {
        background: #eee;
      }

      12.5% {
        background: #aaa;
      }

      12.625% {
        background: #888;
      }

      100% {
        background: #555;
      }
    }

    .ldio-0chhxaqs32b9 div {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #aaa;
      animation: ldio-0chhxaqs32b9 1s linear infinite;
    }

    .loadingio-spinner-blocks-f6re9kg8ubs {
      width: 200px;
      height: 200px;
      display: inline-block;
      overflow: hidden;
      background: #fff;
    }

    .ldio-0chhxaqs32b9 {
      width: 100%;
      height: 100%;
      position: relative;
      transform: translateZ(0) scale(1);
      backface-visibility: hidden;
      transform-origin: 0 0;
      /* see note above */
    }

    .ldio-0chhxaqs32b9 div {
      box-sizing: content-box;
    }
  </style>
</head>

<body class="loading">
  <div class="loader">
    <div class="loadingio-spinner-blocks-f6re9kg8ubs">
      <div class="ldio-0chhxaqs32b9">
        <div style="left: 68px; top: 68px; animation-delay: 0s"></div>
        <div style="left: 90px; top: 68px; animation-delay: 0.125s"></div>
        <div style="left: 112px; top: 68px; animation-delay: 0.25s"></div>
        <div style="left: 68px; top: 90px; animation-delay: 0.875s"></div>
        <div style="left: 112px; top: 90px; animation-delay: 0.375s"></div>
        <div style="left: 68px; top: 112px; animation-delay: 0.75s"></div>
        <div style="left: 90px; top: 112px; animation-delay: 0.625s"></div>
        <div style="left: 112px; top: 112px; animation-delay: 0.5s"></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        document.body.classList.remove("loading");
        document.querySelector(".loader").style.display = "none";
        document.querySelector(".content-not-ready").style.display = "block";
        document.getElementById("preloading-bg-imgs").innerHTML = "";
      }, 1000);
    });
  </script>
</body>

</html>
